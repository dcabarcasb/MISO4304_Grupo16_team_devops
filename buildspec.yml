# AWS CodeBuild - Integracion continua y construccion de la imagen Docker del
# microservicio de lista negra (Entrega 3). Ejecuta las pruebas, publica la
# imagen en ECR y expone los artefactos que consume CodeDeploy.
version: 0.2

phases:
  # Requiere una imagen *standard* de CodeBuild (p. ej.
  # aws/codebuild/amazonlinux-x86_64-standard:5.0), que respeta runtime-versions.
  install:
    runtime-versions:
      python: 3.12
    commands:
      - python --version
      - pip install --upgrade pip
      - pip install -r requirements.txt

  pre_build:
    commands:
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REPO_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPO_NAME
      # SHA del commit: tags inmutables para cada despliegue.
      - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

  build:
    # ABORT: si una prueba falla no se construye ni se sube la imagen.
    on-failure: ABORT
    commands:
      # Las pruebas usan SQLite en memoria (tests/conftest.py), no requieren BD.
      - python -m pytest -v --junitxml=reports/junit.xml
      - docker build -t $REPO_URI:$IMAGE_TAG .
      - docker push $REPO_URI:$IMAGE_TAG

  post_build:
    commands:
      # imageDetail.json es la entrada que CodePipeline entrega a CodeDeploy.
      - printf '{"ImageURI":"%s:%s"}' "$REPO_URI" "$IMAGE_TAG" > imageDetail.json
      - echo "Pushed $REPO_URI:$IMAGE_TAG"

reports:
  pytest-reports:
    files:
      - junit.xml
    base-directory: reports
    file-format: JUNITXML

artifacts:
  files:
    - appspec.yaml
    - taskdef.json
    - imageDetail.json
