# AWS CodeBuild - Integracion continua del microservicio de lista negra.
# Instala dependencias, ejecuta las pruebas unitarias y genera el artefacto
# (ZIP para Elastic Beanstalk). No despliega: solo CI.
version: 0.2

phases:
  # Requiere una imagen *standard* de CodeBuild (p. ej.
  # aws/codebuild/amazonlinux-x86_64-standard:5.0), que respeta runtime-versions.
  # La imagen "ami/amazonlinux-x86_64-base" trae Python 3.14 sin sqlite3.
  install:
    runtime-versions:
      python: 3.12
    commands:
      - python --version
      - pip install --upgrade pip
      - pip install -r requirements.txt

  build:
    # ABORT: si alguna prueba falla se omiten post_build y la carga del
    # artefacto, asi un build fallido nunca deja un ZIP en S3.
    on-failure: ABORT
    commands:
      # Las pruebas usan SQLite en memoria (tests/conftest.py), no requieren BD.
      - python -m pytest -v --junitxml=reports/junit.xml

  post_build:
    commands:
      - echo "Pruebas superadas. Empaquetando artefacto $(cat VERSION) para Elastic Beanstalk."

reports:
  pytest-reports:
    files:
      - junit.xml
    base-directory: reports
    file-format: JUNITXML

artifacts:
  name: blacklist-build
  files:
    - app/**/*
    - .ebextensions/**/*
    - Procfile
    - requirements.txt
    - run.py
    - VERSION
  exclude-paths:
    - "**/__pycache__/**/*"
